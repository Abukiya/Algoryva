services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cp_platform }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cp_platform
    ports: ["3000:3000"]
volumes: { pgdata: {} }
